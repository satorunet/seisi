</script>
<script src="core.js?v=20261016185225"></script>
</head>
<body>
<div id="vig"></div>
<div id="tint"></div>
<div id="tint2"></div>
<div id="flash"></div>
<button id="mute" title="音のON/OFF（M）">🔊</button>

<div id="hud">
  <div id="rank"><b id="rk">-</b><small id="rkN">/8</small><div id="clock">0:00.00</div><div id="where"></div></div>
  <div id="track"><span class="egg">🥚</span></div>
  <div id="lobby"></div>
  <div id="board"></div>
  <div id="toasts"></div>
  <div id="press"><span data-i18n="press">圧力</span><div><i id="pressI"></i></div></div>
  <div id="banner"></div>
  <div id="cereTop"><div id="winBanner"></div><div id="stage"></div></div>
  <div id="drill"><span id="drillL">結合</span><div><i id="drillI"></i></div></div>
  <div id="center"></div>
  <div id="sub"></div>
  <div id="specBar"><b id="specTxt"></b><small data-i18n="specSub">次のレースから参加します</small><div class="row"><button id="specPrev">◀</button><button id="specNext">▶</button><button id="bSolo" data-i18n="solo">待たずにCPUと走る</button></div></div>
  <div id="bottom">
    <div id="spd">0 <small>μm/s</small></div>
    <div id="stam"><i id="stamI"></i></div>
    <div id="stamL" data-i18n="stam">ブースト（スペース / 左クリック長押し）</div>
  </div>
</div>

<div class="ov on" id="title"><div class="card">
  <button class="lang" id="bLang" data-i18n="langBtn">🌐 English</button>
  <span class="tag" data-i18n="tag">ONLINE Sperm RACE</span>
  <h1 data-i18n="h1">3億分の1</h1>
  <p class="lead" data-i18n="lead">一番乗りだけが、いのちになる。</p>
  <div class="nameRow"><label id="iconBtn" title="アイコン"><img id="iconImg" alt=""><i class="fa-solid fa-camera"></i><input type="file" id="iconFile" accept="image/*" hidden></label><input id="name" maxlength="14" placeholder="なまえ（14文字まで）"><button id="iconDel" title="×"><i class="fa-solid fa-xmark"></i></button></div>
  <div class="sw" id="sw"></div>
  <button class="btn" id="bOnline" data-i18n="online">発射</button>
  <button class="btn sub" id="bOffline" data-i18n="offline">練習</button>
  <div id="practiceSel"></div>
  <div class="row2"><button class="btn sub" id="bRank" data-i18n="rankBtn">🏁 ランキング</button><button class="btn sub" id="bAch">🎖 実績</button></div>
  <button class="btn sub" id="bFame" data-i18n="fameBtn">🏆 受精者たちの声</button>
  <div id="msg"></div>
  <p class="credit">Sound: <a href="https://otologic.jp" target="_blank" rel="noopener">OtoLogic</a> (CC BY 4.0)<br>© 2026 <a href="https://satoru.net/" target="_blank" rel="noopener">satoru.net</a> ・ <a href="https://github.com/satorunet/seisi" target="_blank" rel="noopener"><svg class="gh" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg> Source</a></p>
</div></div>

<div class="ov" id="result"><div class="card">
  <p id="resTitle"></p>
  <table id="resTable"></table>
  <p id="resRec"></p>
  <div id="winForm" style="display:none">
    <p class="winAsk" data-i18n="winAsk">🥇 1位の特権！世界にメッセージを残そう</p>
    <input id="winMsg" maxlength="80" data-i18n-ph="msgPh">
    <p id="winFrom" class="credit"></p>
    <div class="row2"><button class="btn" id="bPost" data-i18n="post">残す</button><button class="btn sub" id="bSkip" data-i18n="skip">スキップ</button></div>
  </div>
  <div id="chatBox">
    <div id="chatList"></div>
    <div class="row2 chatRow"><button class="more" id="bMore" title="定型文">…</button><input id="chatIn" maxlength="40" data-i18n-ph="chatPh"><button class="btn" id="bChat" data-i18n="sendChat">送信</button><div id="presets"></div></div>
  </div>
  <p id="resNext"></p>
  <button class="btn" id="bReady" data-i18n="ready">準備OK</button>
  <div class="row2"><button class="btn sub" id="bRank2" data-i18n="rankBtn">🏁 ランキング</button><button class="btn sub" id="bFame2" data-i18n="fameBtn">🏆 受精者たちの声</button></div>
  <button class="btn sub" id="bLeave" data-i18n="leave">タイトルにもどる</button>
</div></div>

<div class="ov" id="fame"><div class="card">
  <p class="fameT" data-i18n="fameTitle">🏆 受精者たちの声</p>
  <div id="fameList"></div>
  <button class="btn sub" id="bFameClose" data-i18n="close">閉じる</button>
</div></div>

<div class="ov" id="rankOv"><div class="card">
  <p class="fameT" data-i18n="rankTitle">🏁 コース別ランキング</p>
  <div id="rankTabs"></div>
  <p id="rankMe"></p>
  <div id="rankList"></div>
  <p class="rankNote" data-i18n="rankNote"></p>
  <button class="btn sub" id="bRankClose" data-i18n="close">閉じる</button>
</div></div>

<div class="ov" id="iconOv"><div class="card">
  <p class="fameT"><i class="fa-solid fa-camera"></i> <span data-i18n="iconTitle">アイコンを合わせる</span></p>
  <div class="icEd"><canvas id="icCrop" width="440" height="440"></canvas><canvas id="icPrev"></canvas></div>
  <p class="rankNote icWrapL" data-i18n="iconZoom">写真の大きさ</p>
  <div class="icZoom"><i class="fa-solid fa-image"></i><input type="range" id="icZoom" min="1" max="4" step="0.01" value="1"><i class="fa-solid fa-image fa-lg"></i></div>
  <p class="rankNote icWrapL" data-i18n="iconWrap">頭への貼り方：小さく ↔ 頭まるごと</p>
  <div class="icZoom"><i class="fa-regular fa-circle-dot"></i><input type="range" id="icWrap" min="0.9" max="3" step="0.05" value="1.65"><i class="fa-solid fa-circle fa-lg"></i></div>
  <p class="rankNote" data-i18n="iconHelp">写真をドラッグして位置を合わせてね</p>
  <div class="row2"><button class="btn sub" id="icCancel" data-i18n="cancel">キャンセル</button><button class="btn" id="icOk" data-i18n="iconOk">これにする</button></div>
</div></div>

<div class="ov" id="achOv"><div class="card">
  <p class="fameT" data-i18n="achTitle">🎖 実績</p>
  <div id="achList"></div>
  <p class="rankNote" data-i18n="achNote"></p>
  <button class="btn sub" id="bAchClose" data-i18n="close">閉じる</button>
</div></div>

<button id="boostBtn">BOOST</button>
<div id="joy"><i></i></div>

<script type="module" src="game.js?v=20261016185225"></script>
</body>
</html>
